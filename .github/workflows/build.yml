name: Build guide
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python build.py out
      - name: Publish
        run: |
          cd out
          git init -q -b dist
          git config user.name "guide-bot"
          git config user.email "guide-bot@users.noreply.github.com"
          git add -A
          git commit -qm "Update guide"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" dist
